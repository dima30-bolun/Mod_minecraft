<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OneFile Studio — 3D Editor</title>
<style>
:root{--bg:#111318;--panel:#181b22;--panel2:#20242d;--line:#303541;--text:#e7eaf0;--muted:#9aa3b2;--accent:#4f8cff;--accent2:#7cde83;--warn:#ffbf4f;--danger:#ff6b6b;--input:#0d0f14;--shadow:0 12px 28px rgba(0,0,0,.35)}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.35 Inter,Segoe UI,Roboto,Arial,sans-serif}button,input,select{font:inherit}button{border:1px solid var(--line);background:linear-gradient(#2a2f3a,#20242d);color:var(--text);border-radius:6px;padding:6px 9px;cursor:pointer}button:hover{border-color:#596273;background:#303744}button.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:#fff}button.danger:hover{border-color:var(--danger)}input,select{width:100%;border:1px solid var(--line);background:var(--input);color:var(--text);border-radius:5px;padding:5px}label{display:block;color:var(--muted);font-size:12px;margin:7px 0 3px}.app{height:100%;display:grid;grid-template-rows:34px 1fr 25px}.topbar{display:flex;align-items:center;background:#0c0e12;border-bottom:1px solid var(--line);padding:0 8px;gap:8px}.brand{font-weight:800;color:#fff;margin-right:10px}.menu{display:flex;height:100%}.menu-item{position:relative;padding:8px 11px;color:var(--muted);cursor:pointer}.menu-item:hover{background:var(--panel2);color:var(--text)}.dropdown{display:none;position:absolute;top:34px;left:0;min-width:190px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);z-index:50;padding:5px;border-radius:0 0 8px 8px}.menu-item:hover .dropdown{display:block}.dropdown button{display:block;width:100%;text-align:left;margin:2px 0;background:transparent;border:0}.workspace{min-height:0;display:grid;grid-template-columns:285px 1fr 320px;grid-template-rows:42px 1fr}.toolbar{grid-column:1/4;display:flex;align-items:center;gap:7px;background:var(--panel);border-bottom:1px solid var(--line);padding:5px 9px}.left,.right{min-height:0;background:var(--panel);overflow:auto}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}.viewport-wrap{position:relative;min-width:0;min-height:0;background:#07080b}.viewport{display:block;width:100%;height:100%;outline:none}.panel-section{border-bottom:1px solid var(--line);padding:10px}.panel-title{font-weight:700;color:#fff;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}.grid-buttons{display:grid;grid-template-columns:1fr 1fr;gap:6px}.object-row{display:flex;align-items:center;gap:6px;padding:5px 7px;border-radius:5px;cursor:pointer;color:var(--muted)}.object-row:hover{background:var(--panel2);color:var(--text)}.object-row.selected{background:#193152;color:#fff}.object-row .name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tiny{font-size:11px;color:var(--muted)}.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.status{display:flex;align-items:center;gap:16px;padding:0 10px;background:#0c0e12;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.overlay{position:absolute;top:10px;left:10px;background:rgba(11,13,18,.72);border:1px solid var(--line);padding:8px;border-radius:8px;color:var(--muted);pointer-events:none}.viewcube{position:absolute;right:12px;top:12px;background:rgba(11,13,18,.72);border:1px solid var(--line);border-radius:8px;padding:8px;color:#fff}.toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:#111827;border:1px solid var(--line);padding:8px 12px;border-radius:8px;box-shadow:var(--shadow);opacity:0;transition:.2s}.toast.show{opacity:1}.split{height:1px;background:var(--line);margin:8px 0}.kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:#dbe4ff;background:#12151c}.hidden-file{display:none}@media(max-width:900px){.workspace{grid-template-columns:210px 1fr;}.right{display:none}.toolbar{grid-column:1/3}}@media(max-width:650px){.workspace{grid-template-columns:1fr}.left{display:none}.toolbar{grid-column:1}.topbar{overflow:auto}.menu-item{padding:8px}.brand{display:none}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">OneFile Studio</div>
    <div class="menu">
      <div class="menu-item">Файл<div class="dropdown"><button id="newProject">Новый проект</button><button id="saveProject">Сохранить JSON</button><button id="loadProjectBtn">Загрузить JSON</button><button id="exportOBJ">Экспорт OBJ</button><button id="importOBJBtn">Импорт OBJ</button><button id="exportSTL">Экспорт STL</button><button id="importSTLBtn">Импорт STL</button></div></div>
      <div class="menu-item">Правка<div class="dropdown"><button id="undoBtn">Undo Ctrl+Z</button><button id="redoBtn">Redo Ctrl+Y</button><button id="copyBtn">Copy Ctrl+C</button><button id="pasteBtn">Paste Ctrl+V</button><button id="deleteBtn">Delete</button></div></div>
      <div class="menu-item">Вид<div class="dropdown"><button id="perspBtn">Перспектива</button><button id="orthoBtn">Ортографическая</button><button id="focusBtn">Фокус F</button><button id="freeCamBtn">Свободная камера</button></div></div>
    </div>
  </div>
  <div class="workspace">
    <div class="toolbar">
      <button data-tool="select" class="active">Select</button><button data-tool="move">Move <span class="kbd">G</span></button><button data-tool="rotate">Rotate <span class="kbd">R</span></button><button data-tool="scale">Scale <span class="kbd">S</span></button>
      <button id="snapBtn">Snap</button><button id="duplicateBtn">Duplicate</button><button id="frameBtn">Frame Selected</button><span class="tiny">Mouse: LMB select, Shift multi, MMB/RMB orbit, wheel zoom, Shift+MMB pan</span>
    </div>
    <aside class="left">
      <div class="panel-section"><div class="panel-title">Создание объектов</div><div class="grid-buttons" id="createButtons"></div></div>
      <div class="panel-section"><div class="panel-title">Дерево объектов <span id="objectCount" class="tiny"></span></div><div id="outliner"></div></div>
    </aside>
    <main class="viewport-wrap"><canvas id="viewport" class="viewport" tabindex="0"></canvas><div class="overlay" id="hud"></div><div class="viewcube" id="viewcube">XYZ</div><div class="toast" id="toast"></div></main>
    <aside class="right">
      <div class="panel-section"><div class="panel-title">Свойства объекта</div><label>Имя</label><input id="objName"><div class="row"><div><label>X</label><input id="posX" type="number" step="0.1"></div><div><label>Y</label><input id="posY" type="number" step="0.1"></div><div><label>Z</label><input id="posZ" type="number" step="0.1"></div></div><div class="row"><div><label>Rot X</label><input id="rotX" type="number" step="1"></div><div><label>Rot Y</label><input id="rotY" type="number" step="1"></div><div><label>Rot Z</label><input id="rotZ" type="number" step="1"></div></div><div class="row"><div><label>Scale X</label><input id="scaleX" type="number" step="0.1"></div><div><label>Scale Y</label><input id="scaleY" type="number" step="0.1"></div><div><label>Scale Z</label><input id="scaleZ" type="number" step="0.1"></div></div><div class="row2" style="margin-top:8px"><button id="hideBtn">Скрыть</button><button id="lockBtn">Блокировать</button></div></div>
      <div class="panel-section"><div class="panel-title">Материал</div><label>Цвет</label><input id="matColor" type="color"><label>Прозрачность</label><input id="matOpacity" type="range" min="0" max="1" step="0.01"><label>Металл</label><input id="matMetal" type="range" min="0" max="1" step="0.01"><label>Шероховатость</label><input id="matRough" type="range" min="0" max="1" step="0.01"><label>Эмиссия</label><input id="matEmissive" type="color"><label>Текстура</label><input id="textureInput" type="file" accept="image/*"></div>
      <div class="panel-section"><div class="panel-title">Сцена</div><div class="row2"><button id="addLight">Добавить свет</button><button id="toggleGrid">Grid</button></div><label>Фон</label><input id="bgColor" type="color" value="#07080b"></div>
    </aside>
  </div>
  <div class="status"><span id="statusText">Готово</span><span id="fps">FPS: --</span><span id="selectionStatus">Selected: 0</span></div>
</div>
<input id="loadProject" class="hidden-file" type="file" accept="application/json,.json"><input id="importOBJ" class="hidden-file" type="file" accept=".obj"><input id="importSTL" class="hidden-file" type="file" accept=".stl">
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/TransformControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/exporters/OBJExporter.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/exporters/STLExporter.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/OBJLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/STLLoader.js"></script>
<script>
'use strict';
class History{constructor(app){this.app=app;this.undoStack=[];this.redoStack=[];this.lock=false}snapshot(label){if(this.lock)return;this.undoStack.push({label,data:this.app.serialize()});if(this.undoStack.length>80)this.undoStack.shift();this.redoStack.length=0;this.app.setStatus(label)}undo(){if(!this.undoStack.length)return;this.redoStack.push({label:'redo',data:this.app.serialize()});const s=this.undoStack.pop();this.lock=true;this.app.deserialize(s.data);this.lock=false;this.app.toast('Undo: '+s.label)}redo(){if(!this.redoStack.length)return;this.undoStack.push({label:'undo',data:this.app.serialize()});const s=this.redoStack.pop();this.lock=true;this.app.deserialize(s.data);this.lock=false;this.app.toast('Redo')}}
class CameraRig{constructor(app){this.app=app;this.target=new THREE.Vector3();this.distance=8;this.theta=Math.PI/4;this.phi=Math.PI/3;this.free=false;this.ortho=false;this.persp=new THREE.PerspectiveCamera(60,1,.01,2000);this.orth=new THREE.OrthographicCamera(-5,5,5,-5,.01,2000);this.active=this.persp;this.update()}resize(w,h){this.persp.aspect=w/h;this.persp.updateProjectionMatrix();const s=this.distance*.55;this.orth.left=-s*w/h;this.orth.right=s*w/h;this.orth.top=s;this.orth.bottom=-s;this.orth.updateProjectionMatrix()}setOrtho(v){const old=this.active;this.ortho=v;this.active=v?this.orth:this.persp;this.active.position.copy(old.position);this.active.rotation.copy(old.rotation);this.update()}update(){if(this.free)return;const eps=.05;this.phi=Math.max(eps,Math.min(Math.PI-eps,this.phi));const p=new THREE.Vector3(Math.sin(this.phi)*Math.sin(this.theta),Math.cos(this.phi),Math.sin(this.phi)*Math.cos(this.theta)).multiplyScalar(this.distance).add(this.target);this.active.position.copy(p);this.active.lookAt(this.target);this.resize(this.app.canvas.clientWidth||1,this.app.canvas.clientHeight||1)}orbit(dx,dy){this.theta-=dx*.006;this.phi-=dy*.006;this.update()}pan(dx,dy){const e=this.active.matrix.elements;const x=new THREE.Vector3(e[0],e[1],e[2]).multiplyScalar(-dx*this.distance*.0015);const y=new THREE.Vector3(e[4],e[5],e[6]).multiplyScalar(dy*this.distance*.0015);this.target.add(x).add(y);this.update()}zoom(delta){this.distance*=Math.exp(delta*.001);this.distance=Math.max(.15,Math.min(600,this.distance));this.update()}focus(obj){const box=new THREE.Box3().setFromObject(obj);if(!box.isEmpty()){box.getCenter(this.target);this.distance=Math.max(.8,box.getSize(new THREE.Vector3()).length()*1.6);this.update()}}}
class EditorApp{constructor(){this.canvas=document.getElementById('viewport');this.renderer=new THREE.WebGLRenderer({canvas:this.canvas,antialias:true,preserveDrawingBuffer:true});this.renderer.shadowMap.enabled=true;this.renderer.setPixelRatio(Math.min(devicePixelRatio,2));this.scene=new THREE.Scene();this.scene.background=new THREE.Color('#07080b');this.cameraRig=new CameraRig(this);this.raycaster=new THREE.Raycaster();this.mouse=new THREE.Vector2();this.objects=[];this.selected=[];this.clipboard=[];this.snap=false;this.tool='select';this.history=new History(this);this.clock=new THREE.Clock();this.frames=0;this.fpsTime=0;this.drag={active:false,button:0,x:0,y:0,pan:false};this.initScene();this.initGizmo();this.bindUI();this.resize();this.history.snapshot('Initial scene');this.animate()}
initScene(){this.grid=new THREE.GridHelper(40,40,0x536070,0x27303a);this.scene.add(this.grid);this.axes=new THREE.AxesHelper(3);this.scene.add(this.axes);const amb=new THREE.HemisphereLight(0xffffff,0x263040,1.7);this.scene.add(amb);const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(6,9,5);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);this.scene.add(sun);this.addObject('Cube',false);}
initGizmo(){this.transform=new THREE.TransformControls(this.cameraRig.active,this.renderer.domElement);this.transform.addEventListener('dragging-changed',e=>{this.controlsDisabled=e.value;if(!e.value){this.commitTransform('Transform')}});this.transform.addEventListener('objectChange',()=>{this.refreshProps();this.renderOutliner()});this.scene.add(this.transform)}
mat(){return new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(Math.random(),.55,.55),roughness:.55,metalness:0,transparent:true,opacity:1,emissive:0x000000})}
geom(type){switch(type){case'Sphere':return new THREE.SphereGeometry(1,24,16);case'UV Sphere':return new THREE.SphereGeometry(1,48,24);case'Icosphere':return new THREE.IcosahedronGeometry(1,3);case'Plane':return new THREE.PlaneGeometry(2,2);case'Cylinder':return new THREE.CylinderGeometry(1,1,2,32);case'Cone':return new THREE.ConeGeometry(1,2,32);case'Torus':return new THREE.TorusGeometry(1,.32,18,64);case'Capsule':return new THREE.CapsuleGeometry(.7,1.3,12,24);case'Circle':return new THREE.CircleGeometry(1,48);default:return new THREE.BoxGeometry(1,1,1)}}
addObject(type,record=true){let o;if(type==='Empty'){o=new THREE.Group();o.add(new THREE.AxesHelper(.8))}else if(type==='Light'){o=new THREE.PointLight(0xffffff,1.8,25);o.position.set(2,3,2)}else{o=new THREE.Mesh(this.geom(type),this.mat());o.castShadow=o.receiveShadow=true;if(type==='Plane'||type==='Circle')o.rotation.x=-Math.PI/2}o.name=this.unique(type);o.userData={editor:true,type,locked:false,hidden:false};o.position.x=(this.objects.length%8)-3.5;this.scene.add(o);this.objects.push(o);this.select([o]);if(record)this.history.snapshot('Add '+type);this.renderOutliner();return o}
unique(base){let i=1,n=base;while(this.objects.some(o=>o.name===n))n=base+'.'+String(i++).padStart(3,'0');return n}
select(list,append=false){if(!append)this.selected=[];for(const o of list)if(o&&!this.selected.includes(o))this.selected.push(o);this.transform.detach();if(this.selected.length===1&&!this.selected[0].userData.locked)this.transform.attach(this.selected[0]);this.refreshProps();this.renderOutliner()}
deleteSelected(){if(!this.selected.length)return;for(const o of this.selected){this.scene.remove(o);this.objects=this.objects.filter(x=>x!==o)}this.selected=[];this.transform.detach();this.history.snapshot('Delete');this.renderOutliner();this.refreshProps()}
duplicate(){this.clipboard=this.selected.map(o=>this.objectData(o));this.paste()}
copy(){this.clipboard=this.selected.map(o=>this.objectData(o));this.toast('Copied '+this.clipboard.length)}
paste(){if(!this.clipboard.length)return;const made=this.clipboard.map(d=>{d=JSON.parse(JSON.stringify(d));d.name=this.unique(d.name.replace(/\.\d+$/,''));d.position.x+=.5;d.position.y+=.5;return this.makeFromData(d)});this.select(made);this.history.snapshot('Paste')}
makeFromData(d){let o=this.addObject(d.type||'Cube',false);o.name=d.name;o.position.fromArray(d.position);o.rotation.fromArray(d.rotation);o.scale.fromArray(d.scale);o.visible=d.visible;o.userData.locked=!!d.locked;if(o.material&&d.material){o.material.color.set(d.material.color);o.material.opacity=d.material.opacity;o.material.transparent=o.material.opacity<1;o.material.metalness=d.material.metalness;o.material.roughness=d.material.roughness;o.material.emissive.set(d.material.emissive)}return o}
objectData(o){return{name:o.name,type:o.userData.type,position:o.position.toArray(),rotation:[o.rotation.x,o.rotation.y,o.rotation.z],scale:o.scale.toArray(),visible:o.visible,locked:!!o.userData.locked,material:o.material?{color:'#'+o.material.color.getHexString(),opacity:o.material.opacity,metalness:o.material.metalness,roughness:o.material.roughness,emissive:'#'+o.material.emissive.getHexString()}:null}}
serialize(){return{version:1,bg:'#'+this.scene.background.getHexString(),objects:this.objects.map(o=>this.objectData(o))}}
deserialize(data){this.objects.forEach(o=>this.scene.remove(o));this.objects=[];this.selected=[];this.scene.background=new THREE.Color(data.bg||'#07080b');(data.objects||[]).forEach(d=>this.makeFromData(d));this.select([]);this.renderOutliner();this.refreshProps()}
commitTransform(label){if(this.snap){for(const o of this.selected){o.position.round();o.rotation.x=Math.round(THREE.MathUtils.radToDeg(o.rotation.x)/15)*Math.PI/12;o.rotation.y=Math.round(THREE.MathUtils.radToDeg(o.rotation.y)/15)*Math.PI/12;o.rotation.z=Math.round(THREE.MathUtils.radToDeg(o.rotation.z)/15)*Math.PI/12}}this.history.snapshot(label);this.refreshProps()}
setTool(t){this.tool=t;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));const map={move:'translate',rotate:'rotate',scale:'scale'};if(map[t])this.transform.setMode(map[t]);if(t==='select')this.transform.detach();else if(this.selected.length===1&&!this.selected[0].userData.locked)this.transform.attach(this.selected[0])}
bindUI(){['Cube','Sphere','UV Sphere','Icosphere','Plane','Cylinder','Cone','Torus','Capsule','Circle','Empty'].forEach(t=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>this.addObject(t);createButtons.appendChild(b)});document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>this.setTool(b.dataset.tool));newProject.onclick=()=>{if(confirm('Очистить сцену?')){this.deserialize({objects:[]});this.addObject('Cube');this.history.snapshot('New project')}};saveProject.onclick=()=>this.download('scene.json',JSON.stringify(this.serialize(),null,2));loadProjectBtn.onclick=()=>loadProject.click();loadProject.onchange=e=>this.readFile(e,'text',t=>{this.deserialize(JSON.parse(t));this.history.snapshot('Load project')});exportOBJ.onclick=()=>this.download('scene.obj',new THREE.OBJExporter().parse(this.exportGroup()));exportSTL.onclick=()=>this.download('scene.stl',new THREE.STLExporter().parse(this.exportGroup()));importOBJBtn.onclick=()=>importOBJ.click();importOBJ.onchange=e=>this.readFile(e,'text',t=>{const g=new THREE.OBJLoader().parse(t);this.ingestImported(g,'OBJ')});importSTLBtn.onclick=()=>importSTL.click();importSTL.onchange=e=>this.readFile(e,'arrayBuffer',b=>{const geo=new THREE.STLLoader().parse(b);const m=new THREE.Mesh(geo,this.mat());m.name=this.unique('STL');m.userData={editor:true,type:'Imported STL',locked:false};this.scene.add(m);this.objects.push(m);this.select([m]);this.history.snapshot('Import STL');this.renderOutliner()});undoBtn.onclick=()=>this.history.undo();redoBtn.onclick=()=>this.history.redo();copyBtn.onclick=()=>this.copy();pasteBtn.onclick=()=>this.paste();deleteBtn.onclick=()=>this.deleteSelected();duplicateBtn.onclick=()=>this.duplicate();frameBtn.onclick=focusBtn.onclick=()=>this.selected[0]&&this.cameraRig.focus(this.selected[0]);perspBtn.onclick=()=>this.switchCamera(false);orthoBtn.onclick=()=>this.switchCamera(true);freeCamBtn.onclick=()=>{this.cameraRig.free=!this.cameraRig.free;this.toast('Free camera: '+(this.cameraRig.free?'on':'off'))};snapBtn.onclick=()=>{this.snap=!this.snap;snapBtn.classList.toggle('active',this.snap)};addLight.onclick=()=>this.addObject('Light');toggleGrid.onclick=()=>this.grid.visible=!this.grid.visible;bgColor.oninput=e=>this.scene.background=new THREE.Color(e.target.value);textureInput.onchange=e=>this.loadTexture(e);['objName','posX','posY','posZ','rotX','rotY','rotZ','scaleX','scaleY','scaleZ','matColor','matOpacity','matMetal','matRough','matEmissive'].forEach(id=>document.getElementById(id).onchange=()=>this.applyProps());hideBtn.onclick=()=>{for(const o of this.selected)o.visible=!o.visible;this.history.snapshot('Visibility');this.renderOutliner()};lockBtn.onclick=()=>{for(const o of this.selected)o.userData.locked=!o.userData.locked;this.transform.detach();this.history.snapshot('Lock');this.renderOutliner()};window.addEventListener('resize',()=>this.resize());this.canvas.addEventListener('pointerdown',e=>this.pointerDown(e));window.addEventListener('pointermove',e=>this.pointerMove(e));window.addEventListener('pointerup',()=>this.drag.active=false);this.canvas.addEventListener('wheel',e=>{e.preventDefault();this.cameraRig.zoom(e.deltaY)},{passive:false});window.addEventListener('keydown',e=>this.key(e))}
switchCamera(ortho){const old=this.cameraRig.active;this.cameraRig.setOrtho(ortho);this.transform.camera=this.cameraRig.active;this.toast(ortho?'Orthographic':'Perspective')}
pointerDown(e){this.canvas.focus();this.drag={active:true,button:e.button,x:e.clientX,y:e.clientY,pan:e.shiftKey||e.button===1};if(e.button===0&&!this.controlsDisabled)this.pick(e)}
pointerMove(e){if(!this.drag.active||this.controlsDisabled)return;const dx=e.clientX-this.drag.x,dy=e.clientY-this.drag.y;this.drag.x=e.clientX;this.drag.y=e.clientY;if(this.drag.button===2||this.drag.button===1){this.drag.pan?this.cameraRig.pan(dx,dy):this.cameraRig.orbit(dx,dy)}}
pick(e){const r=this.canvas.getBoundingClientRect();this.mouse.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);this.raycaster.setFromCamera(this.mouse,this.cameraRig.active);const hits=this.raycaster.intersectObjects(this.objects,true).filter(h=>this.root(h.object)&&this.root(h.object).visible);if(hits[0]){const o=this.root(hits[0].object);this.select([o],e.shiftKey)}else if(!e.shiftKey)this.select([])}
root(o){while(o&&!this.objects.includes(o))o=o.parent;return o}
key(e){if(['INPUT','SELECT'].includes(document.activeElement.tagName))return;if(e.ctrlKey&&e.key.toLowerCase()==='z'){e.preventDefault();return this.history.undo()}if(e.ctrlKey&&e.key.toLowerCase()==='y'){e.preventDefault();return this.history.redo()}if(e.ctrlKey&&e.key.toLowerCase()==='c'){e.preventDefault();return this.copy()}if(e.ctrlKey&&e.key.toLowerCase()==='v'){e.preventDefault();return this.paste()}if(e.key==='Delete')this.deleteSelected();if(e.key.toLowerCase()==='g')this.setTool('move');if(e.key.toLowerCase()==='r')this.setTool('rotate');if(e.key.toLowerCase()==='s')this.setTool('scale');if(e.key.toLowerCase()==='f'&&this.selected[0])this.cameraRig.focus(this.selected[0]);if(e.key==='F2'&&this.selected[0]){objName.focus();objName.select()}}
refreshProps(){selectionStatus.textContent='Selected: '+this.selected.length;const o=this.selected[0];document.querySelectorAll('.right input').forEach(i=>i.disabled=!o);if(!o)return;objName.value=o.name;posX.value=o.position.x.toFixed(3);posY.value=o.position.y.toFixed(3);posZ.value=o.position.z.toFixed(3);rotX.value=THREE.MathUtils.radToDeg(o.rotation.x).toFixed(1);rotY.value=THREE.MathUtils.radToDeg(o.rotation.y).toFixed(1);rotZ.value=THREE.MathUtils.radToDeg(o.rotation.z).toFixed(1);scaleX.value=o.scale.x.toFixed(3);scaleY.value=o.scale.y.toFixed(3);scaleZ.value=o.scale.z.toFixed(3);if(o.material){matColor.value='#'+o.material.color.getHexString();matOpacity.value=o.material.opacity;matMetal.value=o.material.metalness;matRough.value=o.material.roughness;matEmissive.value='#'+o.material.emissive.getHexString()}}
applyProps(){const o=this.selected[0];if(!o||o.userData.locked)return;o.name=objName.value||o.name;o.position.set(+posX.value,+posY.value,+posZ.value);o.rotation.set(THREE.MathUtils.degToRad(+rotX.value),THREE.MathUtils.degToRad(+rotY.value),THREE.MathUtils.degToRad(+rotZ.value));o.scale.set(+scaleX.value,+scaleY.value,+scaleZ.value);if(o.material){o.material.color.set(matColor.value);o.material.opacity=+matOpacity.value;o.material.transparent=o.material.opacity<1;o.material.metalness=+matMetal.value;o.material.roughness=+matRough.value;o.material.emissive.set(matEmissive.value)}this.history.snapshot('Edit properties');this.renderOutliner()}
renderOutliner(){outliner.innerHTML='';objectCount.textContent=this.objects.length;for(const o of this.objects){const r=document.createElement('div');r.className='object-row '+(this.selected.includes(o)?'selected':'');r.innerHTML='<span>'+(o.visible?'◉':'○')+'</span><span class="name"></span><span>'+(o.userData.locked?'🔒':'')+'</span>';r.querySelector('.name').textContent=o.name;r.onclick=e=>this.select([o],e.shiftKey);r.ondblclick=()=>{this.select([o]);objName.focus();objName.select()};outliner.appendChild(r)}}
loadTexture(e){const f=e.target.files[0],o=this.selected[0];if(!f||!o||!o.material)return;const url=URL.createObjectURL(f);new THREE.TextureLoader().load(url,tex=>{tex.colorSpace=THREE.SRGBColorSpace;o.material.map=tex;o.material.needsUpdate=true;URL.revokeObjectURL(url);this.history.snapshot('Texture')})}
exportGroup(){const g=new THREE.Group();this.objects.forEach(o=>{if(o.visible)g.add(o.clone())});return g}
ingestImported(g,label){const made=[];g.traverse(c=>{if(c.isMesh){c.material=this.mat();c.name=this.unique(c.name||label);c.userData={editor:true,type:'Imported '+label,locked:false};c.castShadow=c.receiveShadow=true;this.scene.add(c);this.objects.push(c);made.push(c)}});this.select(made.slice(0,1));this.history.snapshot('Import '+label);this.renderOutliner()}
readFile(e,kind,cb){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>cb(r.result);kind==='arrayBuffer'?r.readAsArrayBuffer(f):r.readAsText(f);e.target.value=''}
download(name,text){const blob=new Blob([text],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
resize(){const w=this.canvas.clientWidth,h=this.canvas.clientHeight;this.renderer.setSize(w,h,false);this.cameraRig.resize(w,h)}
setStatus(t){statusText.textContent=t}
toast(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1300)}
animate(){requestAnimationFrame(()=>this.animate());const dt=this.clock.getDelta();this.fpsTime+=dt;this.frames++;if(this.fpsTime>.5){fps.textContent='FPS: '+Math.round(this.frames/this.fpsTime);this.frames=0;this.fpsTime=0}if(this.cameraRig.free){const speed=dt*5;const keys=EditorApp.keys||{};const dir=new THREE.Vector3();if(keys.KeyW)dir.z-=speed;if(keys.KeyS)dir.z+=speed;if(keys.KeyA)dir.x-=speed;if(keys.KeyD)dir.x+=speed;this.cameraRig.active.translateX(dir.x);this.cameraRig.active.translateZ(dir.z)}hud.innerHTML='Camera: '+(this.cameraRig.ortho?'Ortho':'Perspective')+'<br>Tool: '+this.tool+'<br>Objects: '+this.objects.length+'<br>Selected: '+this.selected.map(o=>o.name).join(', ');this.renderer.render(this.scene,this.cameraRig.active)}
}
window.addEventListener('keydown',e=>(EditorApp.keys||(EditorApp.keys={}))[e.code]=true);window.addEventListener('keyup',e=>(EditorApp.keys||(EditorApp.keys={}))[e.code]=false);window.addEventListener('contextmenu',e=>e.preventDefault());window.addEventListener('DOMContentLoaded',()=>new EditorApp());
</script>
</body>
